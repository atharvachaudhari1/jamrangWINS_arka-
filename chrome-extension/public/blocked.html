<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — JumpyBrain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1020;
      --surface: #1a1b2e;
      --border: #252640;
      --indigo: #6366f1;
      --indigo-light: #a5b4fc;
      --indigo-dim: rgba(99, 102, 241, 0.12);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.12);
      --text: #eef0ff;
      --muted: #9196c0;
      --brand-gradient: linear-gradient(135deg, #7c3aed 0%, #6366f1 45%, #06b6d4 100%);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      font-weight: 700;
      font-size: 15px;
      color: var(--muted);
    }

    .shield {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-name {
      display: inline-block;
      background: var(--amber-dim);
      border: 1px solid var(--amber);
      color: var(--amber);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin: 12px 0 20px;
      word-break: break-all;
    }

    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 11px 20px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--brand-gradient);
      color: #fff;
    }

    .btn-secondary {
      background: var(--indigo-dim);
      color: var(--indigo-light);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .snooze-row {
      display: flex;
      gap: 8px;
    }

    .snooze-row button { flex: 1; font-size: 12px; padding: 8px 10px; }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    #msg { font-size: 13px; color: #10b981; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="13" y1="17" x2="82" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="42%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        <circle cx="23" cy="23" r="5.5" fill="url(#g)"/>
        <path d="M 37 23 L 37 66 Q 37 80 20 80" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
        <path d="M 55 23 L 55 80" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
        <path d="M 55 23 Q 78 23 78 38 Q 78 52 55 52" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
        <path d="M 55 52 Q 82 52 82 66 Q 82 80 55 80" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
      </svg>
      JumpyBrain
    </div>

    <span class="shield">🛡️</span>
    <h1>Site Blocked</h1>

    <div class="site-name" id="site-display">this site</div>

    <p>
      You blocked this site to protect your focus.<br>
      Take a breath — your work is waiting for you.
    </p>

    <div class="actions">
      <button class="btn-primary" onclick="goBack()">← Go Back</button>

      <div class="snooze-row">
        <button class="btn-secondary" onclick="snooze(5)">Snooze 5 min</button>
        <button class="btn-secondary" onclick="snooze(15)">Snooze 15 min</button>
      </div>

      <button class="btn-ghost" onclick="endSession()">End Focus Session</button>
    </div>

    <div id="msg"></div>

    <div class="status" id="status-line"></div>
  </div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const siteName = params.get('site') || 'this site';
    document.getElementById('site-display').textContent = siteName;

    function goBack() {
      if (history.length > 1) {
        history.back();
      } else {
        window.close();
      }
    }

    function showMsg(text, color) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.style.color = color || '#10b981';
      setTimeout(() => { el.textContent = ''; }, 3000);
    }

    function snooze(minutes) {
      if (typeof chrome === 'undefined' || !chrome.runtime) {
        showMsg('Extension not available', '#ef4444');
        return;
      }
      chrome.runtime.sendMessage({ type: 'SNOOZE_BLOCKING', payload: { minutes } }, (res) => {
        if (res?.ok) {
          showMsg(`Unblocked for ${minutes} minutes`);
          setTimeout(() => history.back(), 800);
        } else {
          showMsg('Could not snooze', '#ef4444');
        }
      });
    }

    function endSession() {
      if (typeof chrome === 'undefined' || !chrome.runtime) {
        showMsg('Extension not available', '#ef4444');
        return;
      }
      chrome.runtime.sendMessage({ type: 'RESET_TIMER' }, (res) => {
        if (res?.ok) {
          showMsg('Session ended — sites unblocked');
          setTimeout(() => history.back(), 1000);
        }
      });
    }

    // Show current blocking reason
    if (typeof chrome !== 'undefined' && chrome.runtime) {
      chrome.runtime.sendMessage({ type: 'GET_BLOCKING_STATE' }, (state) => {
        if (!state) return;
        const reasons = [];
        if (state.sessionActive)  reasons.push('focus session active');
        if (state.scheduleActive) reasons.push('scheduled block');
        if (state.snoozed)        reasons.push('snooze active');
        const el = document.getElementById('status-line');
        el.textContent = reasons.length
          ? `Blocked because: ${reasons.join(', ')}`
          : 'Blocking is active';
      });
    }
  </script>
</body>
</html>
