<!doctype html>
<html lang="en">
  <head>

    <title>Doorway — One small step at a time.</title>
    <meta name="description" content="Doorway is an energy-aware academic planner for flexible, guilt-free learning." />

    <!-- PWA. theme-color matches the page background and is updated when the theme changes. -->

    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Doorway — One small step at a time." />
    <meta property="og:description" content="An energy-aware academic planner for flexible, guilt-free learning." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:image" content="/icons/icon-512.png" />
